spring.application.name=MelodyArt

# ==============================================================================
# CONFIGURACIÓN DE BASE DE DATOS (POSTGRESQL) MEDIANTE VARIABLES DE ENTORNO
# ==============================================================================
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/db_mwalls}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# ==============================================================================
# CONFIGURACIÓN DEL POOL DE CONEXIONES HIKARICP (OPTIMIZADO PARA RENDER)
# ==============================================================================
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000

# ==============================================================================
# CONFIGURACIÓN JPA / HIBERNATE
# ==============================================================================
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl